name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip3 install --user --upgrade buildozer cython virtualenv
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create config.py from secrets (optional)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "WARNING: secrets DATABASE_URL / DEEPSEEK_API_KEY не заданы."
            echo "config.py НЕ создан. APK соберётся, но без доступа к БД."
            echo "Проверь Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          printf 'DATABASE_URL = "%s"\nDEEPSEEK_API_KEY = "%s"\n' \
            "$DATABASE_URL" "$DEEPSEEK_API_KEY" > config.py
          echo "config.py создан, размер: $(wc -c < config.py) байт"

      - name: Build APK with Buildozer
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-package
          path: bin/*.apk
