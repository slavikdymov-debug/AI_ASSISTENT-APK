name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # ubuntu-22.04, а не latest: там есть libtinfo5 без костылей
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev aidl \
            build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3" buildozer

      - name: Create config.py from secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "ERROR: secrets DATABASE_URL / DEEPSEEK_API_KEY не заданы"
            exit 1
          fi
          printf 'DATABASE_URL = "%s"\nDEEPSEEK_API_KEY = "%s"\n' \
            "$DATABASE_URL" "$DEEPSEEK_API_KEY" > config.py
          echo "config.py создан, размер: $(wc -c < config.py) байт"

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK
        # yes | — автоматически принимаем лицензии Android SDK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error
